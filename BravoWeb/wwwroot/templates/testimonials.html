<div class="section-container">
    <div class="content">
        <div class="upper-section-content">
            <div class="section-name">
                <div class="name">
                    <p>{{SECTION_LABEL}}</p>
                </div>
                <div class="divider">
                    <div class="divider-left"></div>
                    <div class="divider-right"></div>
                </div>
            </div>

            <div class="section-title">
                <div class="title">
                    <p>{{SECTION_TITLE}}</p>
                </div>

        </div>
        <div class="lower-section-content">

                        <div class="carousel-card-upper-section">

                                <div class="testimonial-carousel-name">{{CARD_1_NAME}}</div>
                                <div class="testimonial-carousel-title">{{CARD_1_TITLE}}</div>

                        </div>
                        <div class="carousel-card-lower-section">
                            {{CARD_1_QUOTE}}
                        </div>
                    </div>

                    <div class="carousel-card">
                        <div class="carousel-card-upper-section">

                            <div class="carousel-card-upper-section-title">
                                <div class="testimonial-carousel-name">{{CARD_2_NAME}}</div>
                                <div class="testimonial-carousel-title">{{CARD_2_TITLE}}</div>

                        <div class="carousel-card-lower-section">

                    <div class="carousel-card">

                                <div class="testimonial-carousel-title">{{CARD_4_TITLE}}</div>
                            </div>

                        <div class="carousel-card-lower-section">
                            {{CARD_4_QUOTE}}

            <div class="carousel-controller">
                <div class="carousel-controller-prev-nav" id="carousel-prev">

                <div class="carousel-controller-next-nav" id="carousel-next">
                    <p>&gt;</p>

            </div>
